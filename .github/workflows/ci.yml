name: CI Pipeline

on:
  push:
    branches:
      - main   # branch di produzione/stabile
      - dev    # branch di sviluppo
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:

    # ambiente virtuale da usare per per le Github actions
    runs-on: ubuntu-latest
    defaults:
      run:
        # necessario perche' file pom.xml e' dentro la directory `roman-number`
        working-directory: roman-number

    steps:

      # scarica il contenuto del repository nella vm
      - name: checkout codice
        uses: actions/checkout@v4

      # installa e configura Java JDK 17 nella vm
      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # compila il progetto verificando che il codice sorgente non contenga errori di compilazione
      - name: compilazione progetto
        run: mvn compile

      # esegue automaticamente tutti i test presenti nel progetto
      # al fallimento di un test la pipeline termina con errore
      - name: esecuzione dei test
        run: mvn test

      # static analysis del codice tramite checkstyle
      # al fallimento la pipeline termina con errore
      - name: checkstyle static analysis
        run: mvn checkstyle:check

      # crea il pacchetto finale dell'applicazione (jar/war) ed esegue JaCoCo per calcolare la code coverage dei test
      - name: package e JaCoCo coverage
        run: mvn package

      # invio coverage a Coveralls
      - name: invio coverage a Coveralls
        run: mvn coveralls:report -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }}
        working-directory: roman-number
